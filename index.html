<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Circle Checker</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:'Inter',sans-serif;
  background:#f3f4f6;
  padding:20px;
}

.box{
  max-width:420px;
  margin:40px auto;
  background:#fff;
  border-radius:24px;
  padding:22px;
  box-shadow:0 15px 40px rgba(0,0,0,.06);
}

h2{
  font-size:25px;
  font-weight:800;
  display:flex;
  align-items:center;
  gap:8px;
}

h2 i{font-size:35px;}

.badge{
  font-size:9px;
  font-weight:600;
  padding:2px 6px;
  border-radius:999px;
  background:#fef9c3;
  color:#92400e;
  border:1px solid #fde68a;
  position:relative;
  top:-6px;
}

.desc{
  font-size:14px;
  color:#777;
  margin:10px 0 18px;
}

.input-wrap{position:relative;}

.input-wrap i{
  position:absolute;
  left:14px;
  top:50%;
  transform:translateY(-50%);
  color:#aaa;
}

input{
  width:100%;
  height:54px;
  border-radius:16px;
  border:1px solid #e5e7eb;
  padding:0 14px 0 40px;
  font-size:15px;
  outline:none;
}

button{
  width:100%;
  height:50px;
  margin-top:12px;
  border:none;
  border-radius:16px;
  background:#111;
  color:#fff;
  font-weight:700;
  cursor:pointer;
}

button.loading{
  pointer-events:none;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
}

button.loading::after{
  content:"";
  width:16px;
  height:16px;
  border:2px solid rgba(255,255,255,.4);
  border-top-color:#fff;
  border-radius:50%;
  animation:spin .7s linear infinite;
}

@keyframes spin{to{transform:rotate(360deg);}}

#hasil{margin-top:16px;}

.empty{
  margin-top:16px;
  padding:18px;
  border-radius:18px;
  background:#fafafa;
  border:1px dashed #e5e7eb;
  display:flex;
  align-items:center;
  gap:14px;
  animation:fadeIn .25s ease;
}

.empty i{
  width:36px;
  height:36px;
  min-width:36px;
  border-radius:50%;
  background:#111;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:14px;
}

.empty.loading-state i{
  animation:spin .8s linear infinite;
}

.empty b{
  display:block;
  font-size:14px;
}

.empty span{
  font-size:12px;
  color:#777;
}

.card{
  background:#fafafa;
  border-radius:18px;
  padding:16px;
  border:1px solid #eee;
  animation:fadeIn .25s ease;
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(6px);}
  to{opacity:1;transform:translateY(0);}
}

.title{
  font-weight:800;
  margin-bottom:12px;
  display:flex;
  align-items:center;
  gap:8px;
}

.label{font-size:12px;color:#777;}
.value{font-size:15px;margin-bottom:10px;}

.red{color:#ef4444;font-weight:800;}
.green{color:#22c55e;font-weight:800;}

.notice{
  margin-top:14px;
  padding:16px 18px;
  font-size:13px;
  font-weight:700;
  line-height:1.6;
  display:flex;
  align-items:center;
  gap:12px;
  border-radius:18px;
}

.notice i{
  width:22px;
  height:22px;
  min-width:22px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
}

.notice.red{
  background:#fef2f2;
  border:1px solid #fecaca;
  color:#b91c1c;
}

.notice.green{
  background:#ecfdf5;
  border:1px solid #bbf7d0;
  color:#166534;
}

.notice.red i{
  background:#b91c1c;
  color:#fff;
}

.notice.green i{
  background:#166534;
  color:#fff;
}

.footer{
  text-align:center;
  margin-top:24px;
  font-size:12px;
  color:#999;
}
</style>
</head>

<body>

<div class="box">
  <h2>
    <i class="fa-solid fa-sim-card"></i>
    Circle Checker
    <span class="badge">by XC-Store</span>
  </h2>

  <div class="desc">Validasi Membership XL Circle</div>

  <div class="input-wrap">
    <i class="fa-solid fa-phone"></i>
    <input type="text" id="msisdn" placeholder="Masukkan nomor HP" inputmode="numeric" autocomplete="off">
  </div>

  <button id="btnMembership" onclick="cekMembership()">Validasi Membership</button>

  <div id="hasil" class="empty">
    <i class="fa-solid fa-magnifying-glass"></i>
    <div>
      <b>Belum ada pengecekan</b>
      <span>Masukkan nomor lalu klik validasi</span>
    </div>
  </div>
</div>

<div class="footer">© 2026 XC-Store. All Rights Reserved.</div>

<script>
const input = document.getElementById("msisdn");
const hasil = document.getElementById("hasil");
const btn = document.getElementById("btnMembership");

function setLoading(x){
  if(x){
    btn.classList.add("loading");
    btn.innerHTML = "Memvalidasi";
  }else{
    btn.classList.remove("loading");
    btn.innerHTML = "Validasi Membership";
  }
}

function showEmpty(icon, title, desc, extraClass = ""){
  hasil.className = `empty ${extraClass}`.trim();
  hasil.innerHTML = `
    <i class="${icon}"></i>
    <div>
      <b>${title}</b>
      <span>${desc}</span>
    </div>
  `;
}

function normalizeInputNumber(value){
  let n = String(value || '').replace(/[^\d+]/g, '');

  if (n.startsWith('+')) {
    n = '+' + n.slice(1).replace(/\D/g, '');
  } else {
    n = n.replace(/\D/g, '');
  }

  if (n.startsWith('+62')) n = '0' + n.slice(3);
  else if (n.startsWith('62')) n = '0' + n.slice(2);
  else if (n.startsWith('8')) n = '0' + n;

  return n.replace(/\D/g, '');
}

function formatMSISDN(value){
  let n = normalizeInputNumber(value);
  if (!n) return '';

  if (n.startsWith('0')) n = '62' + n.slice(1);
  else if (n.startsWith('8')) n = '62' + n;

  return n;
}

input.addEventListener('input', function(){
  this.value = normalizeInputNumber(this.value);
});

input.addEventListener('paste', function(){
  setTimeout(() => {
    this.value = normalizeInputNumber(this.value);
  }, 0);
});

async function cekMembership(){
  const msisdn = formatMSISDN(input.value);
  const msisdnZero = normalizeInputNumber(input.value);

  if(!msisdnZero){
    showEmpty(
      "fa-solid fa-triangle-exclamation",
      "Nomor belum diisi",
      "Masukkan nomor HP terlebih dahulu"
    );
    return;
  }

  setLoading(true);
  showEmpty(
    "fa-solid fa-spinner",
    "Sedang memvalidasi",
    "Mohon tunggu sebentar",
    "loading-state"
  );

  try{
    try{
      const resProxy = await fetch(`/api/membership?number=${encodeURIComponent(msisdnZero)}`, {
        cache: 'no-store'
      });

      const text = await resProxy.text();
      console.log("Response API Pertama:", text);

      let dataProxy;
      try{ dataProxy = JSON.parse(text); }catch{ dataProxy = null; }

      if(false){
        const canSubscribe = dataProxy.data.can_subscribe === true;
        const infoOriginal = dataProxy.data.information || "";
        const info = infoOriginal.toLowerCase();

        let statusText = infoOriginal || (canSubscribe ? "Bisa beli paket Circle" : "Tidak bisa beli paket Circle");
        let statusColor = canSubscribe ? "green" : "red";

        /* ===== MAPPING API PERTAMA ===== */
        if(info.includes("masih/sedang terdaftar di circle")){
          statusText = "Masih/Sedang Tergabung Dalam Circle";
          statusColor = "red";
        }
        else if(info.includes("nomor belum memenuhi syarat")){
          statusText = "Umur kartu masih di bawah 60 hari";
          statusColor = "red";
        }
        else if(info.includes("belum terdaftar di group circle")){
          statusText = "Tidak tergabung Dalam Circle";
          statusColor = "green";
        }
        /* ===== AKHIR MAPPING API PERTAMA ===== */

        tampilkanHasil(msisdnZero, statusText, statusColor);
        return;
      }

    }catch(e){
      console.warn("Proxy gagal:", e);
    }

    const res = await fetch(`https://leonskennedy.my.id/cekcircle/cek_membership.php?msisdn=${msisdn}`);
    const data = await res.json();

    if(!data.ok){
      showEmpty(
        "fa-solid fa-triangle-exclamation",
        "Gagal mengambil data",
        "Silakan coba lagi beberapa saat"
      );
      return;
    }

    /* LEON KENNEDY: TETAP PAKAI RESPON ASLI */
    const statusText = data.membership?.status_text || "-";
    const statusColor = (data.membership?.status_color || "gray").toLowerCase();

    tampilkanHasil(data.msisdn || msisdn, statusText, statusColor);

  }catch(e){
    showEmpty(
      "fa-solid fa-triangle-exclamation",
      "Terjadi kesalahan",
      "Coba lagi beberapa saat"
    );
    console.error(e);
  }finally{
    setLoading(false);
  }
}

function tampilkanHasil(msisdn, statusText, statusColor){
  let notice = "";

  if(statusColor === "green"){
    notice = `
      <div class="notice green">
        <i class="fa-solid fa-check"></i>
        <div>Bisa beli paket XL Circle sekarang!</div>
      </div>`;
  }else{
    notice = `
      <div class="notice red">
        <i class="fa-solid fa-xmark"></i>
        <div>Tidak bisa beli paket XL Circle saat ini, coba lagi bulan depan.</div>
      </div>`;
  }

  hasil.className = "";
  hasil.innerHTML = `
    <div class="card">
      <div class="title"><i class="fa-solid fa-id-card"></i> Membership</div>
      <div class="label">MSISDN</div>
      <div class="value">${msisdn}</div>
      <div class="label">Status</div>
      <div class="value ${statusColor}">${statusText}</div>
      ${notice}
    </div>
  `;
}
</script>

</body>
</html>
